[project]
name = "mobility-sandbox-mv-backend"
version = "0.1.0"
description = "FastAPI backend for Mobility Sandbox MV"
requires-python = ">=3.14,<3.15"
dependencies = [
    "beautifulsoup4>=4.13,<5.0",
    "fastapi>=0.115,<1.0",
    "httpx[http2]>=0.28,<1.0",
    "openpyxl>=3.1,<4.0",
    "pandas>=2.2,<3.0",
    "pypdf>=5.0,<7.0",
    "osmium>=4.0,<5.0",
    "pydantic-settings>=2.7,<3.0",
    "shapely>=2.0,<3.0",
    "uvicorn[standard]>=0.34,<1.0",
    "playwright==1.63.0",
    "reportlab>=4.4,<5",
    "psycopg[binary]>=3.3,<4",
]

[dependency-groups]
dev = [
    "ipykernel>=6.29,<8",
    "matplotlib>=3.10,<4",
    "nbclient>=0.10,<1",
    "nbconvert>=7,<8",
    "nbformat>=5.10,<6",
    "openapi-spec-validator>=0.9.0",
    "pytest>=8.3,<9.0",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.9,<1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
asyncio_mode = "auto"
markers = ["browser: needs locally installed Chromium (no network)"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I"]
