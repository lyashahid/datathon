name: Test and deploy Datathon

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  workflow_dispatch:
    inputs:
      full_checks:
        description: Run the full regression suite and server installer checks
        type: boolean
        default: false
      deploy:
        description: Deploy to production after the build passes (main only)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: datathon-production
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: read
      packages: write
    outputs:
      frontend_digest: ${{ fromJSON(steps.images.outputs.metadata).frontend['containerimage.digest'] }}
      backend_digest: ${{ fromJSON(steps.images.outputs.metadata).backend['containerimage.digest'] }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - name: Quick application and deployment checks
        run: |
          npm ci --no-audit --no-fund
          npm run check
          npm run test:startup
          python3 -I -m unittest discover -s backend/tests -p test_source_use.py -v
          python3 -I -m unittest discover -s deploy/server -p test_deploy.py -v
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        if: inputs.full_checks
        with:
          version: '0.12.19'
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Full regression checks (optional)
        if: inputs.full_checks
        env:
          MOBILITY_ENVIRONMENT: test
          MOBILITY_COMPUTED_CACHE_POSTGRES_ENABLED: 'false'
        run: |
          npm run lint
          npm test
          uv sync --directory backend --frozen --python 3.14
          uv run --directory backend --no-sync ruff check app tests
          uv run --directory backend --no-sync pytest -m 'not browser'
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build both cached images in parallel
        id: images
        uses: docker/bake-action@59cb1203cd42bcefd40a1b6d73b589e48c86040e # v7
        with:
          source: .
          files: deploy/docker-bake.hcl
          push: true
          set: |
            frontend.tags=ghcr.io/lyashahid/datathon-frontend:${{ github.sha }}
            backend.tags=ghcr.io/lyashahid/datathon-backend:${{ github.sha }}
            *.labels.org.opencontainers.image.revision=${{ github.sha }}
      - name: Smoke-test the production images
        env:
          DATATHON_FRONTEND_IMAGE: ghcr.io/lyashahid/datathon-frontend@${{ fromJSON(steps.images.outputs.metadata).frontend['containerimage.digest'] }}
          DATATHON_BACKEND_IMAGE: ghcr.io/lyashahid/datathon-backend@${{ fromJSON(steps.images.outputs.metadata).backend['containerimage.digest'] }}
          FULL_CHECKS: ${{ inputs.full_checks }}
        run: |
          docker pull "$DATATHON_FRONTEND_IMAGE"
          docker pull "$DATATHON_BACKEND_IMAGE"
          if [[ "$FULL_CHECKS" == 'true' ]]; then
            docker run --rm --network none --user 0 --mount "type=bind,src=$GITHUB_WORKSPACE/deploy,dst=/source,readonly" --entrypoint /bin/bash "$DATATHON_BACKEND_IMAGE" /source/test-install-server.sh
          fi
          bash deploy/test-containers.sh

  deploy:
    if: github.ref == 'refs/heads/main' && vars.DATATHON_DEPLOY_ENABLED == 'true' && (github.event_name == 'push' || inputs.deploy)
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: read
      packages: read
    environment:
      name: production
      url: https://yoosufsayyid.com/apps/datathon
    steps:
      - name: Deploy immutable images through restricted SSH key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.DATATHON_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.DATATHON_SSH_KNOWN_HOSTS }}
          SSH_HOST: ${{ vars.DATATHON_SSH_HOST }}
          SSH_USER: ${{ vars.DATATHON_SSH_USER }}
          SSH_PORT: ${{ vars.DATATHON_SSH_PORT || '22' }}
          FRONTEND_DIGEST: ${{ needs.build.outputs.frontend_digest }}
          BACKEND_DIGEST: ${{ needs.build.outputs.backend_digest }}
          REVISION: ${{ github.sha }}
          REGISTRY_USER: ${{ github.repository_owner }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SSH_HOST" =~ ^[a-zA-Z0-9][a-zA-Z0-9.-]*$ ]] || { echo 'Set DATATHON_SSH_HOST.'; exit 1; }
          [[ "$SSH_USER" =~ ^[a-zA-Z_][a-zA-Z0-9_-]*$ ]] || { echo 'Set DATATHON_SSH_USER.'; exit 1; }
          [[ "$SSH_PORT" =~ ^[0-9]{1,5}$ ]] && (( SSH_PORT >= 1 && SSH_PORT <= 65535 )) || exit 1
          [[ -n "$SSH_PRIVATE_KEY" && -n "$SSH_KNOWN_HOSTS" ]] || { echo 'Configure the two DATATHON SSH secrets.'; exit 1; }
          work=$(mktemp -d)
          trap 'rm -rf -- "$work"' EXIT
          chmod 700 "$work"
          printf '%s\n' "$SSH_PRIVATE_KEY" | tr -d '\r' > "$work/key"
          printf '%s\n' "$SSH_KNOWN_HOSTS" | tr -d '\r' > "$work/known_hosts"
          chmod 600 "$work/key" "$work/known_hosts"
          python3 - <<'PY' | ssh -F /dev/null -T -i "$work/key" -p "$SSH_PORT" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$work/known_hosts" -o ConnectTimeout=20 -o ServerAliveInterval=15 -o ServerAliveCountMax=3 -- "$SSH_USER@$SSH_HOST" deploy
          import json, os
          print(json.dumps({
              'frontend_digest': os.environ['FRONTEND_DIGEST'],
              'backend_digest': os.environ['BACKEND_DIGEST'],
              'revision': os.environ['REVISION'],
              'registry_user': os.environ['REGISTRY_USER'],
              'registry_token': os.environ['REGISTRY_TOKEN'],
          }))
          PY
      - name: Verify the public application and API
        run: |
          curl --fail --silent --show-error --retry 6 --retry-delay 5 --retry-all-errors --max-time 30 --location https://yoosufsayyid.com/apps/datathon > /dev/null
          curl --fail --silent --show-error --retry 6 --retry-delay 5 --retry-all-errors --max-time 30 https://yoosufsayyid.com/apps/datathon/api/backend/health | python3 -c "import json,sys; data=json.load(sys.stdin); assert data.get('status') == 'ok'"
